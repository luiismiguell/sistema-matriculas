<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar Conta — Portal Vivência</title>
  <link rel="stylesheet" href="../assets/css/shared.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
</head>
<body class="auth-body">

  <header class="cabecalho">
    <a href="../index.html" class="cabecalho__voltar" title="Voltar à Home">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div style="width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
    </div>
    <h1 class="cabecalho__titulo">Portal Vivência</h1>
    <a href="login.html" class="cabecalho__link" style="margin-left:auto">Já tenho conta</a>
  </header>

  <main class="auth-main">
    <section class="auth-card auth-card--wide">
      <div class="auth-card__cabecalho">
        <div class="cartao__icone cartao__icone--verde">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        </div>
        <div>
          <h2 class="auth-card__titulo">Criar Conta</h2>
          <p class="auth-card__sub">Registre-se no sistema acadêmico</p>
        </div>
      </div>

      <form class="auth-form" id="form-cadastro" novalidate>
        <div class="auth-form__grid">
          <div class="campo">
            <label class="campo__label" for="cad-nome">Nome Completo</label>
            <input class="campo__input" type="text" id="cad-nome" placeholder="Seu nome completo" autocomplete="name" required />
            <span class="campo__erro" id="erro-cad-nome"></span>
          </div>
          <div class="campo">
            <label class="campo__label" for="cad-matricula">Matrícula Acadêmica</label>
            <input class="campo__input" type="text" id="cad-matricula" placeholder="Ex.: 2024001234" required />
            <span class="campo__erro" id="erro-cad-matricula"></span>
          </div>
        </div>
        <div class="campo">
          <label class="campo__label" for="cad-email">E-mail Institucional</label>
          <input class="campo__input" type="email" id="cad-email" placeholder="seu.email@universidade.edu.br" autocomplete="email" required />
          <span class="campo__erro" id="erro-cad-email"></span>
        </div>
        <div class="campo">
          <label class="campo__label" for="cad-curso">Curso</label>
          <select class="campo__select" id="cad-curso" required>
            <option value="">Selecione seu curso</option>
            <option>Ciência da Computação</option>
            <option>Engenharia de Software</option>
            <option>Sistemas de Informação</option>
            <option>Administração</option>
            <option>Direito</option>
            <option>Medicina</option>
            <option>Engenharia Civil</option>
            <option>Psicologia</option>
          </select>
          <span class="campo__erro" id="erro-cad-curso"></span>
        </div>
        <div class="auth-form__grid">
          <div class="campo">
            <label class="campo__label" for="cad-senha">Senha</label>
            <div class="campo__senha-wrapper">
              <input class="campo__input" type="password" id="cad-senha" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required />
              <button type="button" class="campo__olho" data-alvo="cad-senha" aria-label="Mostrar/ocultar senha">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="forca-senha">
              <div class="forca-senha__barra" id="barra-forca"></div>
            </div>
            <span class="campo__erro" id="erro-cad-senha"></span>
          </div>
          <div class="campo">
            <label class="campo__label" for="cad-confirmar">Confirmar Senha</label>
            <div class="campo__senha-wrapper">
              <input class="campo__input" type="password" id="cad-confirmar" placeholder="Repita a senha" autocomplete="new-password" required />
              <button type="button" class="campo__olho" data-alvo="cad-confirmar" aria-label="Mostrar/ocultar senha">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <span class="campo__erro" id="erro-cad-confirmar"></span>
          </div>
        </div>
        <button type="submit" class="btn btn--primario" id="btn-cadastro" style="width:100%;margin-top:.25rem">
          <span class="btn__texto">Criar Conta</span>
          <span class="btn__spinner oculto" aria-hidden="true"></span>
        </button>
        <div class="feedback oculto" id="msg-cadastro"></div>
      </form>

      <p class="auth-card__rodape">
        Já tem conta? <a href="login.html" class="link-discreto">Fazer login</a>
      </p>
    </section>
  </main>

  <footer class="rodape">
    <p>© <span class="ano-atual"></span> Portal Vivência. Todos os direitos reservados.</p>
  </footer>

  <script src="../assets/js/shared.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
