<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Perfil — Portal Vivência</title>
  <link rel="stylesheet" href="../assets/css/shared.css" />
  <link rel="stylesheet" href="../assets/css/perfil.css" />

  <!-- Script anti-flash do tema (deve rodar antes do paint) -->
  <script src="../assets/js/shared.js"></script>
</head>
<body style="display:flex">

  <!-- Skip link para acessibilidade -->
  <a href="#main-content" class="skip-link">Pular para o conteúdo principal</a>

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar" id="sidebar" aria-label="Navegação do painel">
    <div class="sidebar__perfil">
      <div class="sidebar__avatar" id="sidebar-avatar">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div>
        <span class="sidebar__nome" id="sidebar-nome">Carregando…</span>
        <span class="sidebar__sub" id="sidebar-email">—</span>
        <span class="sidebar__badge" id="sidebar-badge">—</span>
      </div>
    </div>
    <nav class="sidebar__nav" id="sidebar-nav">
      <!-- Navigation links will be injected based on user type -->
    </nav>
    <div class="sidebar__rodape">
      <a href="../index.html" class="sidebar__link sidebar__link--sair">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sair
      </a>
    </div>
  </aside>

  <!-- ── LAYOUT ── -->
  <div class="layout">
    <header class="topbar">
      <button class="topbar__menu" id="btn-menu" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="topbar__titulo">Meu Perfil</span>
      <button class="btn-tema" aria-label="Ativar tema escuro" aria-pressed="false" type="button">
        <span class="btn-tema__icone" aria-hidden="true">🌙</span>
        <span class="btn-tema__texto">Tema escuro</span>
      </button>
    </header>

    <main id="main-content" class="conteudo">

      <!-- CABEÇALHO DO PERFIL -->
      <section class="cartao perfil-cabecalho" aria-labelledby="perfil-cabecalho-titulo">
        <h2 id="perfil-cabecalho-titulo" class="sr-only">Cabeçalho do perfil</h2>
        <div class="perfil-cabecalho__conteudo">
          <div class="perfil-cabecalho__avatar" id="perfil-avatar" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="perfil-cabecalho__info">
            <h3 class="perfil-cabecalho__nome" id="perfil-nome">Carregando…</h3>
            <p class="perfil-cabecalho__email" id="perfil-email">—</p>
            <div class="perfil-cabecalho__meta">
              <span class="badge" id="perfil-tipo-badge">—</span>
              <span class="perfil-cabecalho__status" id="perfil-status" aria-hidden="true"></span>
              <span class="perfil-cabecalho__cadastro" id="perfil-cadastro" aria-hidden="true"></span>
            </div>
          </div>
        </div>
      </section>

      <!-- INFORMAÇÕES PESSOAIS -->
      <section class="cartao" aria-labelledby="info-pessoais-titulo">
        <div class="secao-header">
          <h3 id="info-pessoais-titulo" class="secao__titulo">Informações Pessoais</h3>
          <button class="btn btn--outline btn--sm" id="btn-editar-perfil" type="button" aria-expanded="false" aria-controls="form-perfil">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Editar perfil
          </button>
        </div>

        <!-- MODO VISUALIZAÇÃO -->
        <div class="perfil-visualizacao" id="visualizacao-perfil" aria-live="polite">
          <dl class="perfil-dados">
            <div class="perfil-dado">
              <dt class="perfil-dado__label">Nome completo</dt>
              <dd class="perfil-dado__valor" id="view-nome">—</dd>
            </div>
            <div class="perfil-dado">
              <dt class="perfil-dado__label">E-mail</dt>
              <dd class="perfil-dado__valor" id="view-email">—</dd>
            </div>
            <div class="perfil-dado">
              <dt class="perfil-dado__label">Telefone</dt>
              <dd class="perfil-dado__valor" id="view-telefone">—</dd>
            </div>
            <div class="perfil-dado" id="dado-matricula" hidden>
              <dt class="perfil-dado__label">Matrícula</dt>
              <dd class="perfil-dado__valor" id="view-matricula">—</dd>
            </div>
            <div class="perfil-dado" id="dado-curso" hidden>
              <dt class="perfil-dado__label">Curso</dt>
              <dd class="perfil-dado__valor" id="view-curso">—</dd>
            </div>
            <div class="perfil-dado" id="dado-turma" hidden>
              <dt class="perfil-dado__label">Turma</dt>
              <dd class="perfil-dado__valor" id="view-turma">—</dd>
            </div>
            <div class="perfil-dado" id="dado-periodo" hidden>
              <dt class="perfil-dado__label">Período Letivo</dt>
              <dd class="perfil-dado__valor" id="view-periodo">—</dd>
            </div>
          </dl>
        </div>

        <!-- MODO EDIÇÃO -->
        <form class="perfil-edicao oculto" id="form-perfil" novalidate aria-label="Editar perfil">
          <div class="perfil-edicao__grid">
            <div class="campo">
              <label class="campo__label" for="edit-nome">Nome completo <span class="sr-only">(obrigatório)</span></label>
              <input class="campo__input" type="text" id="edit-nome" autocomplete="name" required aria-required="true" aria-describedby="erro-edit-nome" />
              <span class="campo__erro" id="erro-edit-nome" role="alert" aria-live="polite"></span>
            </div>
            <div class="campo">
              <label class="campo__label" for="edit-email">E-mail <span class="sr-only">(obrigatório)</span></label>
              <input class="campo__input" type="email" id="edit-email" autocomplete="email" required aria-required="true" aria-describedby="erro-edit-email" />
              <span class="campo__erro" id="erro-edit-email" role="alert" aria-live="polite"></span>
            </div>
            <div class="campo">
              <label class="campo__label" for="edit-telefone">Telefone</label>
              <input class="campo__input" type="tel" id="edit-telefone" placeholder="(XX) XXXXX-XXXX" autocomplete="tel" aria-describedby="erro-edit-telefone" />
              <span class="campo__erro" id="erro-edit-telefone" role="alert" aria-live="polite"></span>
            </div>
            <div class="campo" id="campo-matricula" hidden>
              <label class="campo__label" for="edit-matricula">Matrícula <span class="sr-only">(não editável)</span></label>
              <input class="campo__input" type="text" id="edit-matricula" readonly aria-readonly="true" />
            </div>
            <div class="campo" id="campo-curso" hidden>
              <label class="campo__label" for="edit-curso">Curso</label>
              <input class="campo__input" type="text" id="edit-curso" readonly aria-readonly="true" />
            </div>
            <div class="campo" id="campo-turma" hidden>
              <label class="campo__label" for="edit-turma">Turma</label>
              <input class="campo__input" type="text" id="edit-turma" readonly aria-readonly="true" />
            </div>
            <div class="campo" id="campo-periodo" hidden>
              <label class="campo__label" for="edit-periodo">Período Letivo</label>
              <input class="campo__input" type="text" id="edit-periodo" readonly aria-readonly="true" />
            </div>
          </div>
          <div class="perfil-edicao__acoes">
            <button type="button" class="btn btn--outline" id="btn-cancelar-edicao">Cancelar</button>
            <button type="submit" class="btn btn--primario" id="btn-salvar-perfil">
              <span class="btn__texto">Salvar alterações</span>
              <span class="btn__spinner oculto" aria-hidden="true"></span>
            </button>
          </div>
          <div class="feedback oculto" id="msg-perfil" role="status" aria-live="polite"></div>
        </form>
      </section>

      <!-- MINHAS PENDÊNCIAS -->
      <section class="cartao" aria-labelledby="pendencias-titulo">
        <h3 id="pendencias-titulo" class="secao__titulo">Minhas Pendências</h3>
        <div id="pendencias-lista" class="pendencias-lista" role="feed" aria-label="Lista de pendências">
          <p class="tabela__vazio" id="pendencias-vazio">Carregando pendências…</p>
        </div>
      </section>

    </main>
  </div>

  <div class="overlay" id="overlay"></div>
  <script src="../assets/js/perfil.js"></script>
  <script>
    initTheme();
    initSidebar();
  </script>
</body>
</html>
