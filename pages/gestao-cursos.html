  <div class="layout">
    <header class="topbar">
      <button class="topbar__menu" id="btn-menu" aria-label="Abrir menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="topbar__titulo">Gestão de Cursos</span>
    </header>

    <main class="conteudo">

      <div class="gestao-header">
        <div>
          <h2 class="gestao-header__titulo">Cursos e Carreiras</h2>
          <p class="gestao-header__sub">Gerencie os cursos oferecidos pela instituição</p>
        </div>
        <button class="btn btn--primario" id="btn-novo-curso">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Novo Curso
        </button>
      </div>

      <!-- MODAL -->
      <div class="modal-overlay oculto" id="modal-overlay">
        <div class="modal">
          <div class="modal__header">
            <h3 class="modal__titulo" id="modal-titulo">Novo Curso</h3>
            <button class="modal__fechar" id="modal-fechar" aria-label="Fechar">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <form class="modal__form" id="form-curso" novalidate>
            <input type="hidden" id="curso-id" />
            <div class="modal__grid">
              <div class="campo">
                <label class="campo__label" for="curso-codigo">Código</label>
                <input class="campo__input" type="text" id="curso-codigo" placeholder="Ex.: CC001" required />
                <span class="campo__erro" id="erro-curso-codigo"></span>
              </div>
              <div class="campo">
                <label class="campo__label" for="curso-duracao">Duração (semestres)</label>
                <input class="campo__input" type="number" id="curso-duracao" placeholder="Ex.: 8" min="1" max="20" required />
                <span class="campo__erro" id="erro-curso-duracao"></span>
              </div>
            </div>
            <div class="campo">
              <label class="campo__label" for="curso-nome">Nome do Curso</label>
              <input class="campo__input" type="text" id="curso-nome" placeholder="Nome completo do curso" required />
              <span class="campo__erro" id="erro-curso-nome"></span>
            </div>
            <div class="modal__grid">
              <div class="campo">
                <label class="campo__label" for="curso-creditos">Total de Créditos</label>
                <input class="campo__input" type="number" id="curso-creditos" placeholder="Ex.: 240" min="1" required />
                <span class="campo__erro" id="erro-curso-creditos"></span>
              </div>
              <div class="campo">
                <label class="campo__label" for="curso-status">Status</label>
                <select class="campo__select" id="curso-status">
                  <option value="ativo">Ativo</option>
                  <option value="inativo">Inativo</option>
                </select>
              </div>
            </div>
            <div class="modal__acoes">
              <button type="button" class="btn btn--outline" id="btn-cancelar">Cancelar</button>
              <button type="submit" class="btn btn--primario">
                <span class="btn__texto">Salvar</span>
                <span class="btn__spinner oculto"></span>
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- TABELA -->
      <div class="cartao" style="padding:0;overflow:hidden">
        <div class="tabela-wrapper">
          <table class="tabela">
            <thead>
              <tr>
                <th>Código</th>
                <th>Nome do Curso</th>
                <th>Duração</th>
                <th>Créditos</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-cursos">
              <tr><td colspan="6" class="tabela__vazio">Carregando…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <div class="overlay" id="overlay"></div>
  <script src="../assets/js/shared.js"></script>
  <script src="../assets/js/gestao-cursos.js"></script>
</body>
</html>
