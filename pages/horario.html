<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Horário — Portal Vivência</title>
  <link rel="stylesheet" href="../assets/css/shared.css" />
  <link rel="stylesheet" href="../assets/css/horario.css" />

  <!-- Script anti-flash do tema (deve rodar antes do paint) -->
  <script src="../assets/js/shared.js"></script>
</head>
<body style="display:flex">

  <!-- Skip link para acessibilidade -->
  <a href="#main-content" class="skip-link">Pular para o conteúdo principal</a>

  <aside class="sidebar" id="sidebar" aria-label="Navegação do painel do aluno">
    <div class="sidebar__perfil">
      <div class="sidebar__avatar">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div>
        <span class="sidebar__nome">Estudante</span>
        <span class="sidebar__sub">2024001234</span>
        <span class="sidebar__badge">Aluno</span>
      </div>
    </div>
    <nav class="sidebar__nav">
      <a href="dashboard-aluno.html" class="sidebar__link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Início
      </a>
      <a href="plano-estudos.html" class="sidebar__link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        Plano de Estudos
      </a>
      <a href="matricula.html" class="sidebar__link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Matrícula
      </a>
      <a href="horario.html" class="sidebar__link sidebar__link--ativo" aria-current="page">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Meu Horário
      </a>
    </nav>
    <div class="sidebar__rodape">
      <a href="../index.html" class="sidebar__link sidebar__link--sair">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sair
      </a>
    </div>
  </aside>

  <div class="layout">
    <header class="topbar">
      <button class="topbar__menu" id="btn-menu" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="topbar__titulo">Meu Horário</span>
      <button class="btn-tema" aria-label="Ativar tema escuro" aria-pressed="false" type="button">
        <span class="btn-tema__icone" aria-hidden="true">🌙</span>
        <span class="btn-tema__texto">Tema escuro</span>
      </button>
    </header>

    <main id="main-content" class="conteudo">

      <section class="banner">
        <div>
          <p class="banner__saudacao">2025 / 1º Semestre</p>
          <h2 class="banner__titulo">Grade de Horários</h2>
          <span class="banner__sub">Sua programação semanal de aulas</span>
        </div>
        <div class="banner__ilustracao" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
      </section>

      <!-- GRADE SEMANAL -->
      <section class="cartao" style="padding:0;overflow:hidden" aria-labelledby="grade-titulo">
        <h3 id="grade-titulo" class="sr-only">Grade de horários semanal</h3>
        <div class="grade-wrapper">
          <table class="grade" id="grade-horario" aria-label="Grade semanal de aulas">
            <thead>
              <tr>
                <th class="grade__hora" scope="col">Horário</th>
                <th scope="col">Segunda</th>
                <th scope="col">Terça</th>
                <th scope="col">Quarta</th>
                <th scope="col">Quinta</th>
                <th scope="col">Sexta</th>
              </tr>
            </thead>
            <tbody id="grade-corpo"></tbody>
          </table>
        </div>
      </section>

      <!-- LEGENDA -->
      <section aria-labelledby="disc-titulo">
        <h3 id="disc-titulo" class="secao__titulo">Disciplinas Matriculadas</h3>
        <div class="disc-lista" id="disc-lista" aria-label="Lista de disciplinas matriculadas"></div>
      </section>

    </main>
  </div>

  <div class="overlay" id="overlay"></div>
  <script src="../assets/js/horario.js"></script>
  <script>
    initTheme();
    initSidebar();
  </script>
</body>
</html>
